name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-hosting
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rewrite canonical URLs for Firebase domain
        run: |
          SITE="https://${{ vars.FIREBASE_PROJECT_ID }}.web.app"
          find dist -type f \( -name '*.html' -o -name '*.xml' -o -name '*.txt' -o -name '*.md' \) -print0 \
            | xargs -0 sed -i "s#https://casino-h5-games.pages.dev#$SITE#g"
          rm -f dist/_headers
          echo "Rewriting to $SITE"
          grep -rl 'web.app' dist | head -20

      - name: Deploy to Firebase Hosting (live channel)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          channelId: live
