name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rewrite canonical URLs for GitHub Pages domain
        run: |
          find dist -type f \( -name '*.html' -o -name '*.xml' -o -name '*.txt' -o -name '*.md' \) -print0 \
            | xargs -0 sed -i 's#https://casino-h5-games.pages.dev#https://vip-4.github.io/casino-h5-games#g'
          rm -f dist/_headers
          echo "Rewritten files:"
          grep -rl 'vip-4.github.io' dist | head -20

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
