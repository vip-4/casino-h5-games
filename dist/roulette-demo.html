<script src="engine.js"></script>
<script>
"use strict";
(function () {
  const { Ease, FSM, AudioManager, ParticleSystem, GameLoop, Stage } = Engine;
  const $ = id => document.getElementById(id);

  const stage = new Stage($("game"));
  const audio = new AudioManager(.22)
    .define("tick", { freq: 900, dur: .03, type: "square", vol: .06 })
    .define("win",  { seq: [523, 659, 784, 1047], dur: .25, type: "triangle", vol: .18, gap: 70 })
    .define("lose", { freq: 180, dur: .25, type: "sine", vol: .1, to: 120 });
  const particles = new ParticleSystem(stage.ctx, 300);

  const fsm = new FSM("IDLE", { IDLE: ["SPINNING"], SPINNING: ["RESULT"], RESULT: ["IDLE"] }, (prev, next) => {
    $("status").textContent = next;
    $("spin").disabled = next !== "IDLE";
    document.querySelectorAll("#ctrl button[data-b]").forEach(b => b.disabled = next !== "IDLE");
    $("num").disabled = next !== "IDLE";
  });

  const RED = new Set([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36]);
  const colorOf = n => n === 0 ? "#2e9e4f" : (RED.has(n) ? "#d4303c" : "#14181c");
  const N = 37, STEP = Math.PI * 2 / N;

  let bal = 1000, bet = 10, choice = "straight", winNum = 0;
  let rotation = 0, startRot = 0, targetRot = 0, spinT = 0, spinDur = 4.2;
  let ballJump = 0, flash = 0, lastTick = -1, resultWait = 0, now = 0;

  function sync() { $("bal").textContent = bal; $("bet").textContent = bet; }
  function startSpin() {
    if (!fsm.is("IDLE") || bal < bet) return;
    const v = parseInt($("num").value, 10);
    if (choice === "straight" && (!Number.isInteger(v) || v < 0 || v > 36)) return;
    bal -= bet; sync(); fsm.set("SPINNING");
    winNum = Math.floor(Math.random() * N); // 伺服器 RNG（此處模擬）
    const base = -Math.PI / 2 - winNum * STEP;
    startRot = rotation;
    targetRot = base + Math.ceil((rotation - base + Math.PI * 2 * 8) / (Math.PI * 2)) * Math.PI * 2;
    if (targetRot <= rotation) targetRot += Math.PI * 2;
    spinT = 0; lastTick = -1; ballJump = 1;
  }
  function payout() {
    if (choice === "straight") return parseInt($("num").value, 10) === winNum ? bet * 36 : 0;
    if (winNum === 0) return 0;
    if (choice === "red") return RED.has(winNum) ? bet * 2 : 0;
    if (choice === "black") return !RED.has(winNum) ? bet * 2 : 0;
    if (choice === "odd") return winNum % 2 === 1 ? bet * 2 : 0;
    if (choice === "even") return winNum % 2 === 0 ? bet * 2 : 0;
    return 0;
  }
  function update(dt) {
    now += dt; if (flash > 0) flash -= dt;
    if (fsm.is("SPINNING")) {
      spinT += dt;
      const p = Math.min(1, spinT / spinDur), e = Ease.outQuint(p);
      rotation = startRot + (targetRot - startRot) * e;
      const slot = Math.floor(rotation / STEP) % N;
      if (slot !== lastTick && p < .92) { lastTick = slot; audio.play("tick"); }
      ballJump = Math.max(0, ballJump - dt * .55);
      if (p >= 1) {
        rotation = targetRot; fsm.set("RESULT");
        const pay = payout();
        if (pay > 0) {
          bal += pay; audio.play("win"); flash = .6;
          particles.burst(stage.w * .34, stage.h * .2, 130, { colors: ["#ffe06a", "#8ef0a8", "#7ef0ff"], power: 1.3, life: 1, shape: 1 });
        } else audio.play("lose");
        sync();
        const col = winNum === 0 ? " 綠" : (RED.has(winNum) ? " 紅" : " 黑");
        $("res").textContent = winNum + col + (pay ? " +" + pay : " -" + bet);
        resultWait = 2;
      }
    } else if (fsm.is("RESULT")) {
      resultWait -= dt; if (resultWait <= 0) fsm.set("IDLE");
    }
    particles.update(dt);
  }
  function render() {
    const c = stage.begin(), W = stage.w, H = stage.h;
    c.fillStyle = "#07120b"; c.fillRect(0, 0, W, H);
    if (flash > 0) { c.fillStyle = `rgba(255,220,100,${flash * .22})`; c.fillRect(0, 0, W, H); }
    const cx = W * .34, cy = H * .52, R = Math.min(H * .38, W * .26);
    c.fillStyle = "#3a2312"; c.beginPath(); c.arc(cx, cy, R + 16, 0, 6.283); c.fill();
    c.strokeStyle = "#b8860b"; c.lineWidth = 4; c.stroke();
    c.save(); c.translate(cx, cy); c.rotate(rotation);
    for (let i = 0; i < N; i++) {
      const a0 = i * STEP - STEP / 2, a1 = i * STEP + STEP / 2;
      c.fillStyle = colorOf(i); c.beginPath(); c.moveTo(0, 0); c.arc(0, 0, R, a0, a1); c.closePath(); c.fill();
      c.strokeStyle = "rgba(255,255,255,.18)"; c.lineWidth = 1; c.stroke();
      c.save(); c.rotate(i * STEP); c.fillStyle = "#fff"; c.font = `bold ${Math.max(9, R * .07)}px sans-serif`;
      c.textAlign = "center"; c.textBaseline = "middle"; c.fillText(String(i), R * .78, 0); c.restore();
    }
    c.fillStyle = "#c9a227"; c.beginPath(); c.arc(0, 0, R * .22, 0, 6.283); c.fill();
    c.fillStyle = "#3a2312"; c.beginPath(); c.arc(0, 0, R * .17, 0, 6.283); c.fill();
    c.restore();
    const bx = cx, by = cy - R * .86 + ballJump * Math.sin(now * 22) * 8;
    c.fillStyle = "#fff"; c.shadowColor = "#fff"; c.shadowBlur = 12;
    c.beginPath(); c.arc(bx, by, Math.max(5, R * .045), 0, 6.283); c.fill(); c.shadowBlur = 0;
    c.fillStyle = "#ffe06a"; c.beginPath(); c.moveTo(cx, cy - R - 30); c.lineTo(cx - 8, cy - R - 14); c.lineTo(cx + 8, cy - R - 14); c.closePath(); c.fill();

    const px = W * .64, py = H * .14, pw = W * .30, ph = H * .72;
    c.fillStyle = "rgba(0,0,0,.35)"; c.beginPath(); c.roundRect(px, py, pw, ph, 14); c.fill();
    c.fillStyle = "rgba(255,255,255,.85)"; c.font = "bold 15px sans-serif"; c.textAlign = "center";
    c.fillText("下注面板 BETTING", px + pw / 2, py + 26);
    const opts = [{ k: "red", t: "紅 RED", c: "#d4303c" }, { k: "black", t: "黑 BLACK", c: "#222" },
      { k: "odd", t: "單 ODD", c: "#2f7fbf" }, { k: "even", t: "偶 EVEN", c: "#2f7fbf" }];
    opts.forEach((o, i) => {
      const x = px + 14 + (i % 2) * (pw - 28) / 2, y = py + 46 + Math.floor(i / 2) * 46;
      c.fillStyle = o.c; c.beginPath(); c.roundRect(x, y, (pw - 34) / 2, 34, 7); c.fill();
      if (choice === o.k) { c.strokeStyle = "#ffe06a"; c.lineWidth = 3; c.stroke(); }
      c.fillStyle = "#fff"; c.font = "12px sans-serif"; c.fillText(o.t, x + (pw - 34) / 4, y + 21);
    });
    c.fillStyle = "#2e9e4f"; c.beginPath(); c.roundRect(px + 14, py + 150, pw - 28, 40, 7); c.fill();
    if (choice === "straight") { c.strokeStyle = "#ffe06a"; c.lineWidth = 3; c.stroke(); }
    c.fillStyle = "#fff"; c.font = "12px sans-serif"; c.fillText("直注 STRAIGHT 35:1", px + pw / 2, py + 175);
    c.fillStyle = "rgba(255,255,255,.5)"; c.font = "11px sans-serif";
    c.fillText("號碼：" + ($("num").value || "—"), px + pw / 2, py + 215);
    if (fsm.is("RESULT")) { c.fillStyle = "#ffe06a"; c.font = "bold 20px sans-serif"; c.fillText("落點 " + winNum, px + pw / 2, py + 250); }
    particles.draw();
  }
  const loop = new GameLoop({ update, render });
  document.querySelectorAll("#ctrl button[data-b]").forEach(b => b.onclick = () => {
    document.querySelectorAll("#ctrl button[data-b]").forEach(x => x.classList.remove("on"));
    b.classList.add("on"); choice = b.dataset.b;
  });
  $("spin").onclick = startSpin;
  sync(); loop.start();
})();
</script>
