<body>
<div class="panel">
  <div class="card">
    <h1>RGS HTTP Client　<span class="badge" id="state">IDLE</span></h1>
    <p class="sub">請先啟動後端：cd rgs-server && npm install && node server.js</p>
    <div class="row"><input id="base" value="http://localhost:8787/api/v1"><input id="pid" value="demo" style="flex:0 0 90px"></div>

    <div class="row" style="margin-top:8px">
      <button class="ghost" id="down">－</button><button id="spin">SPIN 下注</button><button class="ghost" id="up">＋</button>
      <button class="ghost" id="resume">查局 RESUME</button>
      <label><input type="checkbox" id="offline"> 模擬回傳遺失</label>
    </div>
    <p class="sub" id="roundInfo">roundId：—</p>
  </div>

<script>
"use strict";
const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const BASE=()=>$("base").value.replace(/\/+$/,"");
const PID=()=>$("pid").value||"demo";
function log(m,c="info"){const e=$("log");e.innerHTML+=`<span class="${c}">[${new Date().toLocaleTimeString()}] ${m}</span>\n`;e.scrollTop=e.scrollHeight;}

/* ---------- HTTP 層（所有請求帶 roundId / Authorization） ---------- */
async function request(path,{method="GET",body=null,roundId=null}={}){
  const headers={"Authorization":"Bearer "+PID()};
  if(body){headers["Content-Type"]="application/json";}
  if(roundId)headers["Idempotency-Key"]=roundId;
  const res=await fetch(BASE()+path,{method,headers,body:body?JSON.stringify(body):undefined});
  // 模擬「伺服器已處理但回傳遺失」
  if($("offline").checked&&path==="/rounds")throw new Error("RESPONSE_LOST");
  if(res.status===202)return{__PENDING:true,status:"PENDING"};
  if(!res.ok){let d={};try{d=await res.json();}catch(_){}throw new Error("HTTP_"+res.status+" "+(d.error||""));}
  return res.json();
}
const api={
  session:()=>request("/session"),
  create:o=>request("/rounds",{method:"POST",body:o,roundId:o.roundId}),
  get:id=>request("/rounds/"+encodeURIComponent(id)),
  settle:id=>request("/rounds/"+encodeURIComponent(id)+"/settle",{method:"POST",body:{roundId:id},roundId:id})
};

/* ---------- RGS Client（與 rgs-integration.md 同一套邏輯） ---------- */
class RGSClient{
  constructor(onState){this.onState=onState;}
  async play(bet){
    const roundId=crypto.randomUUID();
    const nonce=crypto.randomUUID().slice(0,8);
    sessionStorage.setItem("pendingRound",JSON.stringify({roundId,bet}));
    log(`POST /rounds roundId=${roundId.slice(0,10)}…`,"info");
    try{const r=await api.create({roundId,betAmount:bet,nonce});log("收到伺服器結果","ok");return this._finalize(r);}
    catch(e){log(`失敗：${e.message} → RECONNECTING`,"err");this.onState("RECONNECTING");return this.resume(roundId);}
  }
  async resume(roundId){
    const delays=[300,600,1200,2400,4800,8000];
    for(const d of delays){
      log(`GET /rounds/${roundId.slice(0,8)}… 等待 ${d}ms`,"warn");
      await sleep(d+Math.random()*200);
      try{
        const r=await api.get(roundId);
        if(r.__PENDING){log("PENDING，續輪詢","warn");continue;}
        log("查得既有結果 → 直接還原演出","ok");return this._finalize(r);
      }catch(e){log("重試失敗，繼續…","err");}
    }
    throw new Error("RECONNECT_FAILED:"+roundId);
  }
  _finalize(r){sessionStorage.removeItem("pendingRound");api.settle(r.roundId).then(()=>log("settle 完成","ok")).catch(()=>log("settle 失敗，伺服器補帳","warn"));return r;}
  bootstrap(){const p=JSON.parse(sessionStorage.getItem("pendingRound")||"null");
    if(!p)return null;log(`偵測未完成局 ${p.roundId.slice(0,8)}… → 自動重連`,"warn");return this.resume(p.roundId);}
}

/* ---------- UI ---------- */
const ST={IDLE:"IDLE",REQUESTING:"REQUESTING",RECONNECTING:"RECONNECTING",RESULT:"RESULT"};
let state=ST.IDLE,bet=10;
const rgs=new RGSClient(s=>setState(s));
function setState(s){state=s;$("state").textContent=s;$("spin").disabled=s!==ST.IDLE;$("resume").disabled=s!==ST.IDLE;}
async function refresh(){
  try{const s=await api.session();$("bal").textContent=s.balance;}
  catch(e){$("bal").textContent="離線";log("無法連線後端："+e.message,"err");}
}
async function spin(){
  if(state!==ST.IDLE)return;
  setState(ST.REQUESTING);
  try{
    const r=await rgs.play(bet);
    setState(ST.RESULT);
    $("bal").textContent=r.balanceAfter;$("win").textContent=r.outcome.winAmount;
    $("roundInfo").textContent=`roundId：${r.roundId}　reels：${r.outcome.reels.join(",")}　hash：${r.serverSeedHash.slice(0,16)}…`;
    log(`結果 reels=${r.outcome.reels.join(",")} win=${r.outcome.winAmount}`,"ok");
    await sleep(900);setState(ST.IDLE);
  }catch(e){log(`重連耗盡：${e.message}，保留 roundId 聯絡客服`,"err");setState(ST.IDLE);}
}
$("spin").onclick=spin;
$("down").onclick=()=>{if(state===ST.IDLE){bet=Math.max(1,bet-1);$("bet").textContent=bet;}};
$("up").onclick=()=>{if(state===ST.IDLE){bet=Math.min(100,bet+1);$("bet").textContent=bet;}};
$("resume").onclick=async()=>{
  const p=JSON.parse(sessionStorage.getItem("pendingRound")||"null");
  if(!p){log("沒有未完成的局","warn");return;}
  try{const r=await rgs.resume(p.roundId);$("bal").textContent=r.balanceAfter;$("win").textContent=r.outcome.winAmount;}
  catch(e){log(e.message,"err");}
};
refresh();
Promise.resolve(rgs.bootstrap()).then(r=>{if(r){$("bal").textContent=r.balanceAfter;$("win").textContent=r.outcome.winAmount;}}).catch(()=>{});
log("就緒。勾選「模擬回傳遺失」後按 SPIN，可觀察真實後端的重連流程。","info");
</script>
