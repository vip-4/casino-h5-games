<div class="panel">

    <div class="row">
      <button class="ghost" id="down">－ 注額</button>
      <button id="spin">SPIN 下注</button>
      <button class="ghost" id="up">＋ 注額</button>
      <label><input type="checkbox" id="offline"> 模擬斷線</label>
      <button class="ghost" id="reload">模擬重開頁面</button>
    </div>
    <p class="sub" id="roundInfo">roundId：—</p>
  </div>
  <div class="card"><div id="log"></div></div>

<script>
"use strict";

/* ============================================================
 * 1. Mock RGS（假伺服器）：
 *    - 以 localStorage 當「伺服器帳本」，模擬持久化
 *    - 同一 roundId 重複請求 → 回傳同一結果（冪等），不重複扣款
 *    - 結果由伺服器 RNG 決定，前端看不到 RNG
 * ========================================================== */
const S = ["🍒","🍋","🔔","💎","7","BAR"];
const MockRGS = {
  key: "mockRGS",
  db() { return JSON.parse(localStorage.getItem(this.key) || '{"balance":1000,"rounds":{}}'); },
  save(d) { localStorage.setItem(this.key, JSON.stringify(d)); },
  _delay(ms) { return new Promise(r => setTimeout(r, ms)); },
  _offline() { return document.getElementById("offline").checked; },

  async createRound({ roundId, betAmount, nonce }) {
    await this._delay(200 + Math.random() * 350);
    const d = this.db();
    // 冪等：同一 roundId 直接回傳既有結果
    if (d.rounds[roundId]) return structuredClone(d.rounds[roundId]);
    if (d.balance < betAmount) throw new Error("INSUFFICIENT_FUNDS");

    // 伺服器 RNG（此處仅供模擬；正式環境在後端）
    const reels = [0,1,2].map(() => Math.floor(Math.random() * S.length));
    const winAmount = reels[0] === reels[1] && reels[1] === reels[2] ? betAmount * 25 : (reels.filter(x => x === 0).length >= 2 ? betAmount * 2 : 0);
    d.balance = d.balance - betAmount + winAmount;
    const rec = { roundId, status: "SETTLED", outcome: { reels, winAmount }, balanceAfter: d.balance, nonce, settled: false };
    d.rounds[roundId] = rec;
    this.save(d);
    // 關鍵情境：伺服器已扣款並產生結果，但回傳在網路半路遺失
    if (this._offline()) throw new Error("RESPONSE_LOST");
    return structuredClone(rec);
  },

  async getRound(roundId) {
    if (this._offline()) throw new Error("NETWORK_OFFLINE");
    await this._delay(150);
    const rec = this.db().rounds[roundId];
    return rec ? structuredClone(rec) : { roundId, status: "PENDING" };
  },

  async settle(roundId) {
    if (this._offline()) throw new Error("NETWORK_OFFLINE");
    await this._delay(80);
    const d = this.db();
    if (d.rounds[roundId]) { d.rounds[roundId].settled = true; this.save(d); }
    return { roundId, settled: true };
  }
};

/* ============================================================
 * 2. RGS Client Adapter（可原樣搬到正式專案，只換 base / token）
 * ========================================================== */
class RGSClient {
  constructor(server, onState) { this.server = server; this.onState = onState; }

  async play(betAmount) {
    // 下注前先產生 roundId 並持久化 —— 重連的關鍵
    const roundId = crypto.randomUUID();
    const nonce = crypto.randomUUID().slice(0, 8);
    sessionStorage.setItem("pendingRound", JSON.stringify({ roundId, betAmount }));
    log(`下注請求 roundId=${roundId.slice(0,8)}… bet=${betAmount}`, "info");
    try {
      const data = await this.server.createRound({ roundId, betAmount, nonce });
      log("收到伺服器結果（RNG 決定）", "ok");
      return this._finalize(data);
    } catch (e) {
      log(`連線失敗：${e.message} → 進入 RECONNECTING`, "err");
      if (this.onState) this.onState(STATE.RECONNECTING);
      return this.resume(roundId);
    }
  }

  async resume(roundId) {
    const delays = [300, 600, 1200, 2400, 4800, 8000]; // 指數退避 + 抖動
    for (const d of delays) {
      log(`重試 GET /rounds/${roundId.slice(0,8)}…（等待 ${d}ms）`, "warn");
      await this._sleep(d + Math.random() * 200);
      try {
        const data = await this.server.getRound(roundId);
        if (data.status === "PENDING") { log("伺服器：PENDING，繼續輪詢", "warn"); continue; }
        if (data.status === "SETTLED") {
          log("查得既有結果 → 直接從結果演繹，不再要求 RNG", "ok");
          return this._finalize(data);
        }
      } catch (_) { log("重試仍失敗，繼續…", "err"); }
    }
    throw new Error("RECONNECT_FAILED:" + roundId); // UI 顯示 roundId 供客服查詢
  }

  _finalize(data) {
    sessionStorage.removeItem("pendingRound");
    this.server.settle(data.roundId).then(() => log("settle 完成，帳已結清", "ok")).catch(() => log("settle 失敗，由伺服器補帳", "warn"));
    return data;
  }

  bootstrap() {
    const p = JSON.parse(sessionStorage.getItem("pendingRound") || "null");
    if (!p) return null;
    log(`偵測到未完成局 roundId=${p.roundId.slice(0,8)}… → 自動重連`, "warn");
    return this.resume(p.roundId);
  }

  _sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
}

/* ============================================================
 * 3. UI / FSM 串接
 * ========================================================== */
const STATE = { IDLE:"IDLE", REQUESTING:"REQUESTING", SPINNING:"SPINNING", STOPPING:"STOPPING", WIN:"WIN_PRESENTATION", RECONNECTING:"RECONNECTING" };
const $ = id => document.getElementById(id);
let state = STATE.IDLE, bet = 10, reelTimer = null, spinDone = null;
const rgs = new RGSClient(MockRGS, s => setState(s));

function log(msg, cls="info") {
  const el = $("log");
  el.innerHTML += `<span class="L-${cls}">[${new Date().toLocaleTimeString()}] ${msg}</span>\n`;
  el.scrollTop = el.scrollHeight;
}
function setState(s) { state = s; $("state").textContent = s; $("spin").disabled = s !== STATE.IDLE; }
function syncHUD(data) {
  $("bal").textContent = data ? data.balanceAfter : MockRGS.db().balance;
  $("bet").textContent = bet;
  $("win").textContent = data ? data.outcome.winAmount : 0;
}
function startSpinVisual() {
  $("win").textContent = "0";
  clearInterval(reelTimer);
  reelTimer = setInterval(() => { for (let i=0;i<3;i++) $("r"+i).textContent = S[Math.floor(Math.random()*S.length)]; }, 70);
}
function stopSpinVisual(data) {
  clearInterval(reelTimer);
  data.outcome.reels.forEach((idx,i) => $("r"+i).textContent = S[idx]);
}

async function doSpin() {
  if (state !== STATE.IDLE) return; // 防連點
  const d = MockRGS.db();
  if (d.balance < bet) { log("餘額不足", "err"); return; }
  setState(STATE.REQUESTING);
  startSpinVisual();
  try {
    const data = await rgs.play(bet);          // 内部可能进入 RECONNECTING 并自行恢复
    if (state === STATE.RECONNECTING) log("重連成功，接續演出", "ok");
    setState(STATE.SPINNING);
    await wait(450);
    setState(STATE.STOPPING);
    stopSpinVisual(data);
    syncHUD(data);
    if (data.outcome.winAmount > 0) { setState(STATE.WIN); log(`中獎！win=${data.outcome.winAmount}`, "ok"); await wait(1200); }
    $("roundInfo").textContent = `roundId：${data.roundId}`;
    setState(STATE.IDLE);
  } catch (e) {
    log(`重連耗盡：${e.message}。請保留 roundId 聯絡客服，切勿重下注。`, "err");
    setState(STATE.IDLE);
  }
}
function wait(ms) { return new Promise(r => setTimeout(r, ms)); }

$("spin").onclick = doSpin;
$("down").onclick = () => { if (state===STATE.IDLE) { bet=Math.max(1,bet-1); $("bet").textContent=bet; } };
$("up").onclick   = () => { if (state===STATE.IDLE) { bet=Math.min(100,bet+1); $("bet").textContent=bet; } };
$("reload").onclick = () => location.reload();

syncHUD();
log("就緒。勾選「模擬斷線」再按 SPIN，可觀察重連流程。", "info");
// 頁面載入時自動檢查未完成局
Promise.resolve(rgs.bootstrap()).then(data => { if (data) { stopSpinVisual(data); syncHUD(data); $("roundInfo").textContent = `roundId：${data.roundId}`; } }).catch(()=>{});
</script>
