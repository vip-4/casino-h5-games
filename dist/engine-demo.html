<div id="app">
  <div id="hud">
    <div class="stat"><span>FSM 狀態</span><b id="st">IDLE</b></div>
    <div class="stat"><span>FPS</span><b id="fps">0</b></div>
    <div class="stat"><span>活躍粒子</span><b id="pc">0</b></div>
    <div class="stat"><span>球座標</span><b id="pos">—</b></div>
  </div>
  <div id="stage"><canvas id="game"></canvas></div>
  <div id="ctrl">
    <button id="start">START（IDLE→RUNNING）</button>
    <button id="boom" disabled>BOOM（RUNNING→BOOM）</button>
    <button id="reset">RESET</button>
  </div>
  <div id="hint">點擊畫面：在該處噴發粒子並播放音效　·　所有模組來自 engine.js（GameLoop 固定步長、FSM 非法轉換攔截、Audio 手勢解鎖、Particle 物件池、Stage DPR/RWD）</div>

<script src="engine.js"></script>
<script>
"use strict";
(function(){
  const {Ease,ObjectPool,FSM,AudioManager,ParticleSystem,GameLoop,Stage}=Engine;
  const $=id=>document.getElementById(id);

  const stage=new Stage($("game"));
  const particles=new ParticleSystem(stage.ctx,500);
  const audio=new AudioManager(.3)
    .define("click",{freq:700,dur:.08,type:"square",vol:.15})
    .define("start",{freq:400,dur:.2,type:"triangle",vol:.2,to:800})
    .define("boom",{seq:[180,140,100,70],dur:.35,type:"sawtooth",vol:.25,gap:60});

  const fsm=new FSM("IDLE",{
    IDLE:["RUNNING"],RUNNING:["BOOM","IDLE"],BOOM:["IDLE"]
  },(prev,next)=>{
    $("st").textContent=next;
    $("start").disabled=next!=="IDLE";
    $("boom").disabled=next!=="RUNNING";
  });

  // 球：用物件池示範（單一物件也走池，模式一致）
  const balls=new ObjectPool(1,()=>({active:false,x:0,y:0,vx:0,vy:0,r:18}));
  function spawnBall(){
    const b=balls.acquire();if(!b)return;
    b.x=stage.w*.5;b.y=stage.h*.4;b.vx=160;b.vy=130;
  }
  spawnBall();

  let boomT=0;
  const loop=new GameLoop({
    update(dt){
      balls.forEach(b=>{
        if(fsm.is("RUNNING")){
          b.vy+=520*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;
          if(b.y>stage.h-b.r){b.y=stage.h-b.r;b.vy=-Math.abs(b.vy)*.88;}
          if(b.x>stage.w-b.r){b.x=stage.w-b.r;b.vx=-Math.abs(b.vx);}
          if(b.x<b.r){b.x=b.r;b.vx=Math.abs(b.vx);}
        }
      });
      if(fsm.is("BOOM")){
        boomT+=dt;
        if(boomT>.9){boomT=0;fsm.set("IDLE");spawnBall();}
      }
      particles.update(dt);
    },
    render(){
      const c=stage.begin();
      const g=c.createLinearGradient(0,0,0,stage.h);g.addColorStop(0,"#101a30");g.addColorStop(1,"#050a14");
      c.fillStyle=g;c.fillRect(0,0,stage.w,stage.h);
      c.strokeStyle="rgba(120,200,255,.1)";
      for(let x=0;x<stage.w;x+=40){c.beginPath();c.moveTo(x,0);c.lineTo(x,stage.h);c.stroke();}
      for(let y=0;y<stage.h;y+=40){c.beginPath();c.moveTo(0,y);c.lineTo(stage.w,y);c.stroke();}
      balls.forEach(b=>{
        c.save();c.translate(b.x,b.y);
        c.fillStyle="#7ef0ff";c.shadowColor="#7ef0ff";c.shadowBlur=20;
        c.beginPath();c.arc(0,0,b.r,0,6.283);c.fill();c.restore();
      });
      particles.draw();
      $("fps").textContent=loop.fps;
      $("pc").textContent=particles.count;
      balls.forEach(b=>$("pos").textContent=Math.round(b.x)+", "+Math.round(b.y));
    }
  });

  $("start").onclick=()=>{if(fsm.set("RUNNING"))audio.play("start");};
  $("boom").onclick=()=>{
    if(!fsm.set("BOOM"))return;
    audio.play("boom");
    balls.forEach(b=>particles.burst(b.x,b.y,180,{colors:["#ffe06a","#7ef0ff","#ff5b8a"],power:1.5,life:1.1,shape:1}));
  };
  $("reset").onclick=()=>{fsm.reset("IDLE");balls.releaseAll();spawnBall();particles.clear();};
  $("game").addEventListener("pointerdown",e=>{
    const r=e.currentTarget.getBoundingClientRect();
    const x=(e.clientX-r.left)*(stage.w/r.width),y=(e.clientY-r.top)*(stage.h/r.height);
    particles.burst(x,y,60,{colors:["#ffe06a","#7ef0ff"],power:.9,life:.7});
    audio.play("click");
  });

  loop.start();
})();
</script>
